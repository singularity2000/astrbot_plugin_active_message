<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主动会话控制台</title><link rel="stylesheet" href="./style.css"><script src="./i18n.js" defer></script><script src="./ui.js" defer></script><script src="./placeholders.js" defer></script><script src="./agenda-list.js" defer></script><script src="./agenda.js" defer></script><script src="./changes.js" defer></script><script src="./app.js" defer></script></head>
<body><div class="shell">
<aside class="rail"><div class="brand"><strong data-i18n="pages.console.static.brand">主动会话控制台</strong></div><nav id="nav" aria-label="功能导航" data-i18n-label="pages.console.static.navigation"></nav><div class="rail-foot"><select id="language" aria-label="界面语言" data-i18n-label="pages.console.static.language" disabled><option value="zh-CN">简体中文</option><option value="en-US">English</option></select><button id="tutorial" type="button" data-i18n="pages.console.static.tutorial">新手引导</button><button id="theme" type="button" title="点击切换为浅色">跟随框架（浅色）</button></div></aside>
<div class="workspace"><header>
<h1 id="title">正在连接</h1>
<div id="scope-bar" class="scope-bar" hidden><label><span data-i18n="pages.console.static.editing">正在编辑</span> <select id="scope" aria-label="编辑范围" data-i18n-label="pages.console.static.scope"></select></label><div><strong id="scope-note"></strong><small id="scope-effective"></small></div></div>
<div class="toolbar"><button id="reload" data-i18n="pages.console.static.reload">重新载入</button><button id="save" class="primary" disabled data-i18n="pages.console.static.save">保存并生效</button></div>
<span id="connection" class="muted" data-i18n="pages.console.static.waiting">等待 AstrBot 页面接口</span>
<div class="dirty-slot"><div id="dirty-summary" class="dirty-summary" hidden><div class="dirty-heading"><span id="dirty" class="tag pending" hidden data-i18n="pages.console.static.dirty">有未保存修改</span><small id="dirty-count" title="右侧列表可横向滚动查看全部修改位置" data-i18n-title="pages.console.static.changes_help"></small></div><ul id="dirty-locations" tabindex="0" aria-label="相对于上次保存的修改位置，可横向滚动查看全部" data-i18n-label="pages.console.static.changes_label" aria-live="polite" aria-relevant="additions removals text"></ul></div></div>
</header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<main id="content"><div class="empty">请从已登录的 AstrBot 管理界面打开本页面。连接后即可修改配置、查看运行记录；页面不会自动发送测试消息。</div></main>
<footer data-i18n="pages.console.static.footer">配置修改后请点击“保存并生效”；日程操作会单独保存。判断用的参考资料不等于机器人回复时的全部上下文；回放只展示处理后的文字记录。</footer>
</div></div></body></html>
