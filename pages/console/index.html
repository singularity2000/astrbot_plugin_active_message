<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主动会话 · 运行检查台</title><link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script></head>
<body><div class="shell"><aside class="rail"><div class="brand"><span class="brand-mark">◌</span><div><strong>主动会话</strong><small>运行检查台</small></div></div><nav id="nav" aria-label="功能导航"></nav><div class="rail-foot">原生会话 · 明确规则<br>不替代人格，不建立长期记忆</div></aside><div class="workspace"><header><div><div class="eyebrow">ACTIVE MESSAGE / CONTROL ROOM</div><h1 id="title">正在连接</h1></div><div class="toolbar"><label class="theme-label">外观<select id="theme" aria-label="外观"><option value="auto">自动</option><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="reload">重新载入</button><button id="save" class="primary" disabled>保存并生效</button></div></header><div id="notice" role="status" aria-live="polite"></div><div id="scope-bar" class="scope-bar" hidden><label>编辑范围 <select id="scope" aria-label="编辑范围"></select></label><span id="scope-note"></span><span id="dirty" class="tag" hidden>有未保存修改</span></div><main id="content"><div class="empty">正在等待 AstrBot 页面接口。请从已登录的 Dashboard 打开本页面。</div></main><footer>请求快照标明采集位置；未捕获的内容不会被推测补齐。原始上下文默认不保留。</footer></div></div></body></html>
